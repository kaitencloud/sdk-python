# Every operation in the two contract snapshots, mapped to the SDK method(s) that call it.
#
# tests/test_coverage.py reads this file and fails when:
#   - an operation in openapi.yaml or platform-openapi.yaml is neither mapped nor excluded,
#   - a mapped method is missing from the sync or the async client,
#   - a client exposes a public method that nothing here maps.
#
# So a contract sync that adds an endpoint cannot ship silently unwrapped, and a wrapper
# cannot exist without naming the operation it calls. scripts/generate_models.py reads
# the exclusions too: a model only reachable from an excluded operation is not generated.

core:
