    createCustomerSession: billing.customer_sessions.create
    revokeCustomerSession: billing.customer_sessions.revoke
    listPublishableKeys: billing.publishable_keys.list
    createPublishableKey: billing.publishable_keys.create
    updatePublishableKey: billing.publishable_keys.update
    revokePublishableKey: billing.publishable_keys.revoke

    # billing: a customer's payment method and provider portal
