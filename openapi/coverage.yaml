    # billing: settings, capabilities and the payment providers
    getBillingSettings: billing.get_settings
    updateBillingSettings: billing.update_settings
    getBillingCapabilities: billing.get_capabilities
    getBillingHealth: billing.get_health
    syncBillingProvider: billing.sync
    closeBillingPeriods: billing.close_periods

    # billing: add-ons, their families, grants, prices and compatibility
    listAddons: billing.addons.list
    getAddon: billing.addons.get
