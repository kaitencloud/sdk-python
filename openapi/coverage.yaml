    detachPaymentMethod: billing.customers.detach_payment_method
    createPaymentMethodSession: billing.customers.create_payment_method_session
    completePaymentMethodSession: billing.customers.complete_payment_method_session
    createPortalSession: billing.customers.create_portal_session

    # billing: the accounting handoff
    listHandoff: billing.handoff.list
    claimHandoff: billing.handoff.claim
    ackHandoff: billing.handoff.ack

    # billing: an instance's add-ons and redeemed vouchers
    listInstanceAddons: billing.instance_addons.list
    attachInstanceAddon: billing.instance_addons.attach
    setInstanceAddonQuantity: billing.instance_addons.set_quantity
    detachInstanceAddon: billing.instance_addons.detach
    listInstanceVouchers: billing.instance_vouchers.list
    redeemVoucher: billing.instance_vouchers.redeem
    revokeInstanceVoucher: billing.instance_vouchers.revoke

    # billing: invoices
    listInvoices: billing.invoices.list
    getInvoice: billing.invoices.get
    exportInvoices: billing.invoices.export
    voidInvoice: billing.invoices.void
    recomposeInvoice: billing.invoices.recompose
    markInvoicePaid: billing.invoices.mark_paid
