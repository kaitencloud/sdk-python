  excluded:
    listNotifications: >-
      A person's own notification feed. It addresses the signed-in user's rows -- an unread
      count and a set of choices about what to be told -- and a machine client holding an API
      token has neither; wrapping it would mean pretending to be a particular human. kaiten's
      own operation-coverage test exempts these four operations for the same reason.
    markNotificationsRead: A person's own read state; an API token has none.
    getNotificationPreferences: A person's own notification choices; an API token has none.
    putNotificationPreferences: A person's own notification choices; an API token has none.

    evaluateFlag: >-
      OFREP, which is a protocol before it is an endpoint. Kaiten implements it so that any
      OpenFeature SDK can evaluate its flags through the generic OFREP provider -- in Python,
      `openfeature-provider-ofrep`. That provider already has the hooks, the evaluation
      context, the typed accessors and the default-on-failure semantics OpenFeature defines,
      so a method here would be a second and worse client for the same endpoint, and would
      tie flag evaluation to this SDK. The README and examples/playbook.py show the provider.
    evaluateFlagsBulk: >-
      OFREP, like evaluateFlag: the provider calls it when an OpenFeature client evaluates
      every flag at once. (sdk-js does keep a bulk call, but only to feed the licensing
      snapshot its React components render; nothing in a Python SDK needs that.)

    GetMe: >-
      The signed-in person's own profile and access. A machine client holding an API token has
      no human profile. kaiten's own operation-coverage test exempts this operation and the
      eleven below as console authoring, for the same reasons.
    GetAuthorization: >-
      Request-time identity and grant introspection, which Kaiten's SaaS middleware consumes;
      not product automation.
    ListUsers: The human member directory, administered in the console and the operational CLI.
    GetUser: An administrator's view of a human member's profile.
    UpdateUser: An administrator's edit of a human identity, not machine account automation.
    PutUserAuthorization: >-
      An administrator's replacement of a person's roles and permissions -- never a service
      token's.
    SetUserAssignments: The console's role and direct-scope editor for a person.
    SetUserEnabled: A person's membership access lifecycle, administered by a human.
    ListRoles: The role directory of the console and the operational CLI.
    CreateRole: Scope-group authoring by a human administrator.
    UpdateRole: Scope-group authoring by a human administrator.
    DeleteRole: Scope-group lifecycle, administered by a human.

platform:
